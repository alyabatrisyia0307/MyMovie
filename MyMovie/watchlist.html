<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyMovie — My Watchlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
  <img src="logo.jpg" alt="MyMovie Logo" class="logo-img" />
  MyMovie
</div>
    <nav>
      <a href="index.html">Search & Discover</a>
      <a href="watchlist.html" class="active">My Watchlist</a>
    </nav>
  </header>

  <main class="container">
    <!-- STATISTIC WATCHED VS PENDING -->
    <section class="card" style="display: flex; gap: 20px; text-align: center;">
      <div style="flex: 1; background: rgba(143, 240, 164, 0.1); padding: 15px; border-radius: 8px; border: 1px solid #8ff0a4;">
        <h3 style="color: #8ff0a4; margin-bottom: 5px;">✅ Watched</h3>
        <h1 id="statWatched" style="font-size: 36px; margin: 0; color: white;">0</h1>
      </div>
      <div style="flex: 1; background: rgba(255, 107, 107, 0.1); padding: 15px; border-radius: 8px; border: 1px solid #ff6b6b;">
        <h3 style="color: #ff6b6b; margin-bottom: 5px;">⏳ Pending</h3>
        <h1 id="statUnwatched" style="font-size: 36px; margin: 0; color: white;">0</h1>
      </div>
    </section>

    <section class="card">
      <h2> My Watchlist</h2>
      
      <!-- Overall Stats -->
      <div id="summary" class="summary"></div>
      
      <!-- Movie List -->
      <div id="listContainer" class="list-container"></div>
    </section>
  </main>

  <!-- Edit Modal (Update) -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Movie Details</h3>
        <label>Title</label>
      <input id="editTitle" type="text" disabled style="background: #2a2a40; color: #888; cursor: not-allowed;" />
      
      <label style="margin-top: 10px;">Watch Count (times)<input id="editCount" type="number" min="1" /></label>
      <label>Personal Rating (1-10)<input id="editRating" type="number" min="1" max="10" step="0.1" /></label>
      
      <label style="display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer;">
        <input type="checkbox" id="editWatched" style="width: 20px; height: 20px; margin: 0;" />
        Mark as Watched ✅
      </label>

      <div class="modal-actions">
        <button id="saveEditBtn" class="btn primary">Save Changes</button>
        <button id="cancelEditBtn" class="btn secondary">Cancel</button>
      </div>
    </div>

  <script src="watchlist.js"></script>
</body>
</html>
